# Nightly build of the nginx-redirect image. Runs on our amd64 VM runner (shell executor, see
# docs/runner.md). On the default branch (push, nightly schedule, manual "Run pipeline") the image is
# rebuilt on the latest official nginx:1.30-alpine + Alpine updates, tested and pushed to our
# registry, then mirrored to Docker Hub; elsewhere (merge requests, other branches) it is built and
# tested only. Every gate (version floor, redirect smoke tests, negative tests, CVE gate) runs inside
# build.sh before anything is pushed.
#
# CI/CD variables (Settings > CI/CD > Variables): NTFY_TOPIC (notifications; unset = none),
# NTFY_TOKEN (masked, optional), DOCKERHUB_USER + DOCKERHUB_TOKEN (masked, protected: Docker Hub
# mirror; unset = mirror skipped).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [test, build, notify]

default:
  tags: [nginx-redirect-amd64]

variables:
  NTFY_URL: https://notif.developpeur-freelance.io
  # Scanner of tests/scan.sh (refuses only a new fixable CRITICAL), pinned by digest, as in
  # frankenphp-docker. To update: check the release, then `docker buildx imagetools inspect aquasec/trivy:<version>`.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

# Publishing pipelines: default branch, pushed to, scheduled or started by hand.
.publish: &publish
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web)$/

# The shell executor shares the gitlab-runner user's home: each job logs in to the registries with
# its own Docker config, outside the checkout (build.sh refuses to push from a dirty tree).
.registry:
  variables:
    DOCKER_CONFIG: $CI_BUILDS_DIR/docker-config-$CI_JOB_ID
  before_script:
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u gitlab-ci-token --password-stdin
    - set -a; . ./versions.env; set +a
    - '[ "$IMAGE" = "$CI_REGISTRY_IMAGE" ] || { echo "IMAGE in versions.env ($IMAGE) is not this project''s registry ($CI_REGISTRY_IMAGE)" >&2; exit 1; }'
    - |
      if [ -n "${DOCKERHUB_USER:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USER" --password-stdin
      else
        echo "DOCKERHUB_USER/DOCKERHUB_TOKEN not set (or branch not protected): Docker Hub mirror skipped"
        export DOCKERHUB_MIRROR=0
      fi
  after_script:
    - rm -rf "$DOCKER_CONFIG"

unit:
  stage: test
  script:
    - tests/unit.sh

guard:
  stage: test
  script:
    - tests/guard.sh

build:
  stage: build
  extends: .registry
  resource_group: nginx-redirect
  timeout: 30m
  rules:
    - <<: *publish
      variables:
        BUILD_ARGS: --push
    - when: on_success
      variables:
        BUILD_ARGS: ""
  script:
    - ./build.sh $BUILD_ARGS
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-report.json
      - trivy-report.txt
      - trivy-published.json

notify:failure:
  stage: notify
  rules:
    - <<: *publish
      when: on_failure
  script:
    - >
      scripts/notify.sh urgent rotating_light
      "nginx-redirect-docker: ${CI_PIPELINE_SOURCE} pipeline FAILED"
      "Pipeline #${CI_PIPELINE_IID} on ${CI_COMMIT_SHORT_SHA} failed. The moving tags keep their previous image unless a push step itself broke. Open the pipeline to see which gate refused."
